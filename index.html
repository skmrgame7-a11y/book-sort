<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eee5d5"><title>Book Sort ― 綺麗な書斎</title><style>*{box-sizing:border-box}body{margin:0;background:#eee5d5;color:#65472f;font-family:Georgia,serif;user-select:none}main{max-width:520px;margin:auto;padding:14px}h1{text-align:center;letter-spacing:2px;margin:5px}header p{text-align:center;letter-spacing:3px;margin:4px 0 15px}.stats{display:flex;justify-content:space-between;font:13px sans-serif;margin:8px}.case{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding:7px;background:linear-gradient(100deg,#88603e,#b18a60 48%,#795334);border:2px solid #735033;border-radius:5px;box-shadow:0 4px 7px #60402033}.shelf{position:relative;display:flex;align-items:flex-end;gap:2px;padding:5px 5px 3px;height:47px;background:linear-gradient(#493225,#705039);box-shadow:inset 0 3px 5px #27160e88;border:1px solid #69482f;perspective:400px;cursor:pointer}.right{flex-direction:row-reverse}.book{position:relative;width:calc((100% - 8px)/5);height:35px;border-radius:2px;background:linear-gradient(90deg,#0003,transparent 20%,#fff2 35%,transparent 70%,#0002),var(--c);box-shadow:1px 1px 2px #20130b88;transition:transform .16s}.book:before{content:'';position:absolute;inset:5px 3px;border-top:3px double #e5ca8c;border-bottom:3px double #e5ca8c}.book:after{content:'';position:absolute;top:14px;left:30%;width:40%;height:8px;border:1px solid #d8bd80;background:#e7d5aa88}.selected{outline:2px solid #f3d68a;z-index:2}.lift{transform:translateY(-7px)}.glass,.door{position:absolute;inset:0;transform-origin:left center}.right .glass,.right .door{transform-origin:right center}.glass{border:3px solid #bc986e;background:linear-gradient(125deg,transparent 13%,#fff3 14%,#fff3 19%,transparent 20%,transparent 25%,#fff2 26%,#fff2 30%,transparent 31%,#d5ebf415);pointer-events:none}.closing{animation:close .35s ease-out}.door{background:linear-gradient(110deg,#956b45,#b58b61,#926740);border:2px solid #6f4c31;box-shadow:inset 0 0 0 4px #b48b62,inset 0 0 0 5px #795233;transition:transform .35s,opacity .35s}.door:before{content:'';position:absolute;inset:9px;background:repeating-linear-gradient(2deg,transparent 0 7px,#6f4b3010 8px 9px)}.glass:after,.door:after{content:'';position:absolute;right:5px;top:33%;width:4px;height:34%;border-radius:3px;background:linear-gradient(90deg,#9c7437,#f2d391,#a27b3e)}.right .glass:after,.right .door:after{right:auto;left:5px}.door.open{transform:rotateY(-100deg);opacity:0;pointer-events:none}.right .door.open{transform:rotateY(100deg)}.controls{display:flex;gap:6px;margin-top:12px}button{flex:1;border:1px solid #9d7952;border-radius:5px;padding:12px 4px;background:linear-gradient(#f6ebd5,#d9c19b);color:#65472f;font-weight:bold;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.4}#msg{text-align:center;font:13px sans-serif;min-height:20px}.stage{position:relative}.win{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#39241455;z-index:10;overflow:hidden;animation:fade .7s}.award{position:relative;z-index:2;text-align:center;background:linear-gradient(#f8eed9,#e2c99f);border:4px double #9d7952;padding:24px;width:85%;max-width:280px;border-radius:6px;box-shadow:0 5px 20px #38231166}.award button{width:100%;margin-top:7px}.spark{position:absolute;color:#ffe3a0;font-size:20px;animation:spark 1.6s ease-out both;pointer-events:none}[hidden]{display:none!important}@keyframes close{from{transform:rotateY(85deg);opacity:.3}to{transform:rotateY(0);opacity:1}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes spark{0%{opacity:0;transform:translateY(20px)}40%{opacity:1}100%{opacity:0;transform:translateY(-45px)}}</style><main><header><h1>Book Sort</h1><p>綺麗な書斎</p></header><div class="stats"><span id="level"></span><span id="count"></span></div><div class="stage"><div class="case" id="shelves"></div><div class="win" id="win" hidden><div class="award">✦ COMPLETE ✦<h2>整理完了</h2><p>すべての本が<br>美しく収まりました。</p><button id="continue">次の書斎へ</button><button id="view">本棚を眺める</button></div></div></div><div class="controls"><button id="undo">一手戻す</button><button id="add">棚を追加</button><button id="reset">やり直す</button><button id="next">次の問題</button></div><p id="msg"></p></main><script>
const $=id=>document.getElementById(id),colors=['#a83f42','#3c709e','#648354','#c7a04c','#82638e','#bd7744'];let board,initial,history,selected,opened,level=1,n,goal,reserves,won,nodes,timer;const clone=b=>b.map(a=>a.slice()),rand=n=>Math.floor(Math.random()*n),full=a=>a.length===5&&a.every(c=>c===a[0]),run=a=>{let k=0;while(k<a.length&&a[a.length-1-k]===a[a.length-1])k++;return k},shuffle=a=>{for(let i=a.length-1;i>0;i--){let j=rand(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
function generate(){n=10+rand(11);goal=n-1;reserves=2+n%2;let c=n<=15?5:6,base=Math.round(goal/c),counts=Array(c).fill(base);while(counts.reduce((a,b)=>a+b,0)!==goal){let d=goal-counts.reduce((a,b)=>a+b,0)>0?1:-1,i=rand(c);if(counts[i]+d>=Math.max(1,base-1)&&counts[i]+d<=base+1)counts[i]+=d}for(let t=0;t<20;t++){let a=rand(c),b=rand(c);if(a!==b&&counts[a]>Math.max(1,base-1)&&counts[b]<base+1){counts[a]--;counts[b]++}}let pool=[];counts.forEach((k,col)=>pool.push(...Array(k*5).fill(col)));let lengths=shuffle([...Array(n-3).fill(5),4,3,3]);while(true){shuffle(pool);let p=0,b=lengths.map(l=>pool.slice(p,p+=l));if(b.every(a=>new Set(a).size>=3))return b.concat([[],[]])}}
function hide(){clearTimeout(timer);$('win').hidden=true;$('win').querySelectorAll('.spark').forEach(e=>e.remove())}function start(fresh){hide();if(fresh)initial=generate();board=clone(initial).concat(Array.from({length:reserves},()=>[]));history=[];selected=-1;opened=0;won=false;build();render(false)}function build(){$('shelves').innerHTML='';nodes=board.map((a,i)=>{let d=document.createElement('div');d.className='shelf'+(i%2?' right':'');d.onclick=()=>tap(i);let books=Array.from({length:5},()=>{let b=document.createElement('div');b.className='book';d.append(b);return b});let glass=document.createElement('div');glass.className='glass';glass.hidden=true;d.append(glass);let door=null;if(i>=n+2){door=document.createElement('div');door.className='door';d.append(door)}$('shelves').append(d);return{d,books,glass,door,complete:false}})}function snapshot(){history.push({board:clone(board),opened})}function tap(i){if(won||i>=n+2+opened||full(board[i]))return;if(selected===i){selected=-1;render();return}if(selected<0){if(board[i].length)selected=i;render();return}let a=board[selected],b=board[i],c=a[a.length-1];if(b.length<5&&(!b.length||b[b.length-1]===c)){snapshot();b.push(...a.splice(-Math.min(run(a),5-b.length)));selected=-1}else selected=b.length?i:-1;render()}function celebrate(){$('win').hidden=false;for(let i=0;i<22;i++){let s=document.createElement('span');s.className='spark';s.textContent=i%2?'✧':'✦';s.style.left=(5+rand(90))+'%';s.style.top=(10+rand(80))+'%';s.style.animationDelay=rand(500)+'ms';$('win').append(s)}}function render(animate=true){board.forEach((a,i)=>{let v=nodes[i];v.d.classList.toggle('selected',selected===i);v.books.forEach((b,j)=>{b.hidden=j>=a.length;if(j<a.length)b.style.setProperty('--c',colors[a[j]]);b.classList.toggle('lift',selected===i&&j>=a.length-run(a))});let complete=full(a);if(complete!==v.complete){v.glass.hidden=!complete;v.glass.classList.remove('closing');if(complete&&animate)v.glass.classList.add('closing');v.complete=complete}if(v.door)v.door.classList.toggle('open',i<n+2+opened)});let done=board.filter(full).length,was=won;won=done===goal;$('level').textContent='書斎 '+level;$('count').textContent='整理 '+done+' / '+goal;$('undo').disabled=!history.length;$('add').disabled=opened===reserves||won;$('add').textContent='棚を追加 ('+(reserves-opened)+')';$('msg').textContent=won?'整理完了！':selected>=0?'移動先の棚を選んでください。':'同じ色の本を5冊揃えよう。';if(won&&!was)timer=setTimeout(celebrate,450)}$('undo').onclick=()=>{if(!history.length)return;hide();let s=history.pop();board=s.board;opened=s.opened;selected=-1;render(false)};$('add').onclick=()=>{if(opened<reserves&&!won){snapshot();opened++;selected=-1;render()}};$('reset').onclick=()=>start(false);function next(){level++;start(true)}$('next').onclick=next;$('continue').onclick=next;$('view').onclick=hide;start(true);
</script></html>
